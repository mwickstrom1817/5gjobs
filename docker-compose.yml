version: "3.8"

services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8501"
    volumes:
      # Mount your real secrets file (created on the server, never committed).
      - ./.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    environment:
      # Streamlit-specific settings so it behaves well behind a reverse proxy.
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLECORS=false
      - STREAMLIT_BROWSER_GATHERUSAGESTATS=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
